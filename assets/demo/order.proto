syntax = "proto3";

package order.v1;

message Order {
  string order_id = 1;
  string user_id = 2;
  string product = 3;
  int32 quantity = 4;
}

message CreateOrderRequest {
  string user_id = 1;
  string product = 2;
  int32 quantity = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}
